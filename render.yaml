services:
  - type: web
    name: bilheteria-cinema-brasileiro-analytics
    runtime: python
    plan: free
    rootDir: projeto_completo
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn index:server --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
